name: Clean PR 42 fixture headers

on:
  push:
    branches:
      - refactor/thread-aware-execution-orchestration

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: refactor/thread-aware-execution-orchestration
          fetch-depth: 0

      - name: Remove generator escape sentinels and revalidate fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          root = Path("evidence/software-engineering/2026-08-27-durable-thread-carrier/fixture")
          changed = []
          for path in sorted(root.iterdir()):
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              if text.startswith("\\\n"):
                  path.write_text(text[2:], encoding="utf-8")
                  changed.append(path.name)
          if not changed:
              raise SystemExit("no fixture escape sentinels found")
          print("cleaned:", ", ".join(changed))
          PY

          RUN_PARENT="$(mktemp -d)"
          RUN_DIR="$RUN_PARENT/carrier-fixture"
          FIXTURE="evidence/software-engineering/2026-08-27-durable-thread-carrier/fixture"
          python3 "$FIXTURE/setup.py" --root "$RUN_DIR"
          set +e
          python3 "$FIXTURE/verify.py" --repo "$RUN_DIR/repo"
          BASELINE_EXIT=$?
          set -e
          test "$BASELINE_EXIT" -ne 0
          python3 "$FIXTURE/apply_reference.py" --repo "$RUN_DIR/repo"
          python3 "$FIXTURE/verify.py" --repo "$RUN_DIR/repo"
          python3 "$FIXTURE/teardown.py" --root "$RUN_DIR"
          rm -rf "$RUN_PARENT"

          rm .github/workflows/pr42-fixture-cleanup.yml
          git add .github/workflows/pr42-fixture-cleanup.yml "$FIXTURE"
          git diff --cached --check
          git commit -m "Clean durable-thread fixture headers"
          git push origin HEAD:refactor/thread-aware-execution-orchestration
