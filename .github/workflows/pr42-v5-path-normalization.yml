name: Normalize PR 42 evaluation v5 paths

on:
  push:
    branches:
      - refactor/thread-aware-execution-orchestration

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: refactor/thread-aware-execution-orchestration
          fetch-depth: 0

      - name: Normalize run and fixture roots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "evidence/software-engineering/2026-08-27-durable-thread-carrier/cases.json"
          )
          data = json.loads(path.read_text(encoding="utf-8"))

          replacements = {
              "python3 fixture/setup.py --root <RUN_DIR>":
                  "python3 fixture/setup.py --root <RUN_DIR>/fixture",
              "<RUN_DIR>/fixture-metadata.json":
                  "<RUN_DIR>/fixture/fixture-metadata.json",
              "python3 fixture/verify.py --repo <RUN_DIR>/repo":
                  "python3 fixture/verify.py --repo <RUN_DIR>/fixture/repo",
              "python3 fixture/teardown.py --root <RUN_DIR>":
                  "python3 fixture/teardown.py --root <RUN_DIR>/fixture",
          }

          counts = {old: 0 for old in replacements}

          def rewrite(value):
              if isinstance(value, str):
                  result = value
                  for old, new in replacements.items():
                      occurrences = result.count(old)
                      if occurrences:
                          counts[old] += occurrences
                          result = result.replace(old, new)
                  return result
              if isinstance(value, list):
                  return [rewrite(item) for item in value]
              if isinstance(value, dict):
                  return {key: rewrite(item) for key, item in value.items()}
              return value

          data = rewrite(data)
          if counts["python3 fixture/setup.py --root <RUN_DIR>"] != 1:
              raise SystemExit(f"unexpected setup replacement count: {counts}")
          if counts["<RUN_DIR>/fixture-metadata.json"] != 1:
              raise SystemExit(f"unexpected metadata replacement count: {counts}")
          if counts["python3 fixture/verify.py --repo <RUN_DIR>/repo"] < 1:
              raise SystemExit(f"no legacy verification path found: {counts}")
          if counts["python3 fixture/teardown.py --root <RUN_DIR>"] != 1:
              raise SystemExit(f"unexpected teardown replacement count: {counts}")

          common = data["common_fixture"]
          expected = {
              "setup_command": "python3 fixture/setup.py --root <RUN_DIR>/fixture",
              "metadata_file": "<RUN_DIR>/fixture/fixture-metadata.json",
              "verification_command": (
                  "python3 fixture/verify.py --repo <RUN_DIR>/fixture/repo"
              ),
              "teardown_command": (
                  "python3 fixture/teardown.py --root <RUN_DIR>/fixture"
              ),
              "final_verification_command": (
                  "python3 fixture/verify.py --repo <RUN_DIR>/fixture/repo"
              ),
          }
          for key, expected_value in expected.items():
              if common.get(key) != expected_value:
                  raise SystemExit(
                      f"common fixture mismatch for {key}: {common.get(key)!r}"
                  )

          serialized = json.dumps(data, indent=2, ensure_ascii=False) + "\n"
          for old in replacements:
              if old in serialized:
                  raise SystemExit(f"legacy fixture path remains: {old}")
          path.write_text(serialized, encoding="utf-8")
          PY

          python3 -m json.tool \
            evidence/software-engineering/2026-08-27-durable-thread-carrier/cases.json \
            >/dev/null
          rm .github/workflows/pr42-v5-path-normalization.yml
          git add \
            .github/workflows/pr42-v5-path-normalization.yml \
            evidence/software-engineering/2026-08-27-durable-thread-carrier/cases.json
          git diff --cached --check
          git commit -m "Normalize durable-thread evaluation run paths"
          git push origin HEAD:refactor/thread-aware-execution-orchestration
