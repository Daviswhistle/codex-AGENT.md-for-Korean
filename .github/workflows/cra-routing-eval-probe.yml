name: CRA routing eval credential probe

on:
  push:
    branches:
      - agent/autonomous-cra-selection

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_OPENAI_API_KEY: ${{ secrets.CODEX_OPENAI_API_KEY }}
    steps:
      - name: Report credential availability without exposing values
        shell: bash
        run: |
          found=0
          if [[ -n "$OPENAI_API_KEY" ]]; then
            echo "OPENAI_API_KEY=present"
            found=1
          else
            echo "OPENAI_API_KEY=absent"
          fi
          if [[ -n "$CODEX_OPENAI_API_KEY" ]]; then
            echo "CODEX_OPENAI_API_KEY=present"
            found=1
          else
            echo "CODEX_OPENAI_API_KEY=absent"
          fi
          if [[ "$found" -eq 0 ]]; then
            echo "No configured API credential is available for an isolated Codex behavior run."
          fi
