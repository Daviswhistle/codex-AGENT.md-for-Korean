name: Record PR 42 evaluation v5

on:
  push:
    branches:
      - refactor/thread-aware-execution-orchestration

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: refactor/thread-aware-execution-orchestration
          fetch-depth: 0

      - name: Update evaluation contract, self-test, and record evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          EVIDENCE="evidence/software-engineering/2026-08-27-durable-thread-carrier"
          FIXTURE="$EVIDENCE/fixture"
          BASELINE="aa2ae97856d7968e50511864c03f1babcd608d0d"
          CANDIDATE_POLICY="4a87005223d235dc29873fbe602445617a52decb"

          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = Path("evidence/software-engineering/2026-08-27-durable-thread-carrier")
          cases_path = evidence / "cases.json"
          cases = json.loads(cases_path.read_text(encoding="utf-8"))
          cases["evaluation_id"] = "software-engineering-durable-thread-v5"
          cases["policy_loading"] = {
              "unit": "one exact detached policy checkout and fresh CODEX_HOME per individual run",
              "baseline_policy_commit": "aa2ae97856d7968e50511864c03f1babcd608d0d",
              "candidate_policy_commit": "4a87005223d235dc29873fbe602445617a52decb",
              "install_command": (
                  "python3 fixture/install_policy.py --source-repo <EVALUATION_REPOSITORY> "
                  "--policy-commit <POLICY_COMMIT> --policy-side <baseline|candidate> "
                  "--run-dir <RUN_DIR>/policy"
              ),
              "manifest": "<RUN_DIR>/policy/policy-load-manifest.json",
              "session_environment": "CODEX_HOME=<RUN_DIR>/policy/codex-home",
              "required_attestation": [
                  "requested, resolved, and checkout commit equal the assigned policy commit",
                  "kit, AGENTS.md, and software-engineering links resolve into the exact checkout",
                  "source and installed root/skill/interface SHA-256 identities match",
                  "the root session is a fresh process launched with the attested CODEX_HOME",
                  "the measured session boot attestation matches the external manifest",
              ],
          }
          unique = cases["run_isolation"]["unique_per_execution"]
          for value in (
              "policy checkout",
              "policy-load manifest",
              "Codex launcher process and environment",
              "boot-attestation output",
          ):
              if value not in unique:
                  unique.append(value)
          identical = cases["run_isolation"]["identical_across_pair"]
          if "boot-attestation prompt" not in identical:
              identical.append("boot-attestation prompt")

          cases["common_fixture"].update(
              {
                  "policy_install_command": cases["policy_loading"]["install_command"],
                  "policy_manifest": cases["policy_loading"]["manifest"],
                  "policy_session_environment": cases["policy_loading"][
                      "session_environment"
                  ],
                  "integration_command": (
                      "python3 fixture/integrate_worktree.py --source <isolated-worktree> "
                      "--target <repo> --expected-base <primary_sha> "
                      "--writer-stopped-marker <state>/writer-stopped.json "
                      "--manifest <RUN_DIR>/integration-manifest.json"
                  ),
                  "final_verification_command": (
                      "python3 fixture/verify.py --repo <RUN_DIR>/fixture/repo"
                  ),
              }
          )
          cases["required_common_trace_assertions"] = [
              "The exact side-specific policy is installed and attested before any measured root session starts.",
              "The root process uses the manifest CODEX_HOME and no prior process, root context, or loaded skill state is reused.",
              "The external policy manifest and measured boot attestation agree on commit, link targets, and root/skill/interface identities.",
              "Any implementation completion is verified in the designated final primary worktree, not only in an isolated source worktree.",
          ]

          active = next(
              item
              for item in cases["cases"]
              if item["case_id"] == "SE-ACTIVE-WRITER-PREFLIGHT-ORDER"
          )
          active["controller_setup"] = [
              "Create a fresh isolated execution and load the exact policy side before launching the measured root session.",
              "Start fixture/hold_writer.py against <repo> and wait for <state>/writer-ready.json.",
              "Do not release the writer until the measured run selects waiting or creates a separate mutable worktree and branch at <primary_sha>.",
              "If a separate worktree is selected, record it as an intermediate source only; the designated final worktree remains <repo>.",
          ]
          active["required_trace_assertions"] = [
              "No repository-state-dependent durable preflight starts against the mutating primary worktree.",
              "Candidate either waits for writer-stopped.json and refreshes the primary mutable worktree, or binds the thread to a separate mutable worktree and branch.",
              "Candidate does not treat a fixed snapshot as sufficient for write activation.",
              "Activation uses the refreshed or separately isolated writable starting state.",
              "An isolated-worktree oracle pass is only intermediate and is never accepted as final completion.",
              "Before integration, the durable writer is terminal, the original primary writer is released and stopped, and the primary worktree is reconciled clean at <primary_sha>.",
              "The primary/controller integrates exactly the allowed task diff without a commit and runs the independent oracle in <repo>.",
          ]
          active["valid_completion_paths"] = [
              {
                  "name": "wait-refresh-and-complete-in-primary",
                  "check": "python3 fixture/verify.py --repo <RUN_DIR>/fixture/repo",
              },
              {
                  "name": "separate-worktree-integrate-and-complete-in-primary",
                  "intermediate_check": (
                      "python3 fixture/verify.py --repo <isolated-worktree>"
                  ),
                  "integration_check": cases["common_fixture"]["integration_command"],
                  "final_check": (
                      "python3 fixture/verify.py --repo <RUN_DIR>/fixture/repo"
                  ),
                  "required_result": (
                      "integration-manifest.json identifies <repo> as target, keeps HEAD at "
                      "<primary_sha>, creates no commit, and applies exactly src/labels.py "
                      "and tests/test_labels.py"
                  ),
              },
          ]
          cases_path.write_text(
              json.dumps(cases, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          grades_path = evidence / "manual-grades.json"
          grades = json.loads(grades_path.read_text(encoding="utf-8"))
          grades["evaluation_id"] = "software-engineering-durable-thread-v5"
          grades["summary"]["fixture_self_test"] = "pending v5 run"
          grades["summary"]["policy_install_identity_self_test"] = "pending v5 run"
          grades["summary"]["isolated_worktree_integration_self_test"] = "pending v5 run"
          for case in grades["cases"]:
              case["fixture"] = "defined; v5 self-test pending"
          grades_path.write_text(
              json.dumps(grades, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          RUN_PARENT="$(mktemp -d)"
          RUN_DIR="$RUN_PARENT/carrier-fixture"
          set +e
          python3 "$FIXTURE/self_test.py" \
            --root "$RUN_DIR" \
            --source-repo "$PWD" \
            --baseline-commit "$BASELINE" \
            --candidate-commit "$CANDIDATE_POLICY" \
            > "$EVIDENCE/fixture-self-test.log" 2>&1
          FIXTURE_EXIT=$?
          set -e
          rm -rf "$RUN_PARENT"
          if [ "$FIXTURE_EXIT" -ne 0 ]; then
            cat "$EVIDENCE/fixture-self-test.log"
            exit "$FIXTURE_EXIT"
          fi

          CODEX_PATH="$(command -v codex 2>/dev/null || true)"
          if [ -n "$CODEX_PATH" ]; then CODEX_EXIT=0; else CODEX_EXIT=1; fi
          {
            echo '$ command -v codex'
            test -z "$CODEX_PATH" || echo "$CODEX_PATH"
            echo "exit=$CODEX_EXIT"
            echo
            echo '$ python3 --version'
            python3 --version
            echo
            echo '$ git rev-parse HEAD'
            git rev-parse HEAD
            echo
            echo '$ git status --short --branch'
            git status --short --branch
            echo
            echo "GitHub Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Runner OS: ${RUNNER_OS}"
            echo "Runner architecture: ${RUNNER_ARCH}"
            echo "No surfaced child-agent or durable-thread model/tool session exists in this workflow."
          } > "$EVIDENCE/environment-probe.txt"

          set +e
          python3 scripts/validate_kit.py > "$EVIDENCE/validate-kit.log" 2>&1
          VALIDATE_EXIT=$?
          set -e

          git diff "$BASELINE" "$CANDIDATE_POLICY" -- \
            README.md \
            skills/README.md \
            skills/software-engineering/SKILL.md \
            skills/software-engineering/agents/openai.yaml \
            skills/software-engineering/references/README.md \
            skills/software-engineering/references/execution-delegation.md \
            skills/software-engineering/references/tca-loop.md \
            skills/software-engineering/references/worker-delegation.md \
            decisions/2026-08-27-durable-thread-execution-carrier.md \
            > "$EVIDENCE/policy-diff.txt"

          export EVIDENCE CODEX_EXIT VALIDATE_EXIT FIXTURE_EXIT BASELINE CANDIDATE_POLICY
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from textwrap import dedent

          evidence = Path(os.environ["EVIDENCE"])
          run_id = os.environ["GITHUB_RUN_ID"]
          run_url = (
              f'{os.environ["GITHUB_SERVER_URL"]}/'
              f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}'
          )
          validate_exit = int(os.environ["VALIDATE_EXIT"])
          codex_exit = int(os.environ["CODEX_EXIT"])

          grades_path = evidence / "manual-grades.json"
          grades = json.loads(grades_path.read_text(encoding="utf-8"))
          grades["summary"].update(
              {
                  "fixture_self_test": "passed",
                  "policy_install_identity_self_test": "passed",
                  "isolated_worktree_integration_self_test": "passed",
              }
          )
          grades["repository_validation"] = {
              "validate_kit_exit_in_v5_evidence_run": validate_exit,
              "fixture_v5_self_test_exit": 0,
          }
          for case in grades["cases"]:
              case["fixture"] = "defined and v5 self-tested"
          grades_path.write_text(
              json.dumps(grades, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          metadata = {
              "evaluation_id": "software-engineering-durable-thread-v5",
              "github_actions_run_id": run_id,
              "github_actions_run_url": run_url,
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "baseline_commit": os.environ["BASELINE"],
              "candidate_policy_commit": os.environ["CANDIDATE_POLICY"],
              "codex_command_exit": codex_exit,
              "model": "unavailable",
              "reasoning_effort": "unavailable",
              "sandbox": "unavailable",
              "approval_policy": "unavailable",
              "fixture_v5_self_test_exit": 0,
              "policy_install_identity_self_test": "passed",
              "isolated_worktree_integration_self_test": "passed",
              "validate_kit_exit_in_v5_evidence_run": validate_exit,
          }
          (evidence / "run-metadata.json").write_text(
              json.dumps(metadata, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          validation_status = "passed" if validate_exit == 0 else "failed"
          readme = dedent(f"""\
          # Durable-thread carrier representative evaluation

          날짜: 2026-08-28

          ## 결론

          이 기록은 PR #42의 정책 수정, 실행 가능한 fixture, 평가 계획, 실제 행동
          평가를 분리해 보존한다. v5 계획은 각 baseline/candidate 실행 전에 지정
          commit을 detached checkout으로 만들고 그 checkout 자체의 installer로 fresh
          `CODEX_HOME`에 설치한다. External manifest와 measured-session boot attestation이
          root `AGENTS.md`, 전체 `software-engineering` tree, `SKILL.md`, interface metadata의
          identity를 함께 검증해야 한다.

          별도 mutable worktree를 쓰는 active-writer 경로도 isolated oracle 통과만으로
          끝나지 않는다. 원래 writer를 종료하고 primary worktree를 reconcile한 뒤 허용된
          diff를 commit 없이 primary에 통합하고, 지정된 최종 primary worktree에서 oracle을
          다시 통과해야 한다.

          기준선과 후보를 실제 Codex model/tool session에서 실행하는 행동 평가는 아직
          **수행되지 않았다**. 현재 사용 가능한 환경에는 `codex` 실행 파일과
          child-agent·durable-thread tool surface가 없었다. 따라서 실행하지 않은 결과를
          통과로 표시하지 않으며 durable-thread 행동 검증은 명시적인 병합 차단 항목으로
          남는다.

          ## 고정 조건

          - 평가 ID: `software-engineering-durable-thread-v5`
          - 기준선 commit: `{os.environ['BASELINE']}`
          - 후보 정책 commit: `{os.environ['CANDIDATE_POLICY']}`
          - 실행 환경과 v5 self-test run: GitHub Actions run `{run_id}`
          - model·reasoning effort·sandbox·approval policy: unavailable
          - surfaced child-agent tools: unavailable
          - surfaced durable-thread tools: unavailable
          - fixture v5 self-test: passed (exit `0`)
          - exact policy install/identity self-test: passed
          - isolated-worktree integration self-test: passed
          - evidence-run `python3 scripts/validate_kit.py`: {validation_status} (exit `{validate_exit}`)

          원시 환경은 [`environment-probe.txt`](environment-probe.txt), fixture 실행은
          [`fixture-self-test.log`](fixture-self-test.log), 저장소 검증은
          [`validate-kit.log`](validate-kit.log), 모든 직접 연결 정책 변경의 고정 diff는
          [`policy-diff.txt`](policy-diff.txt), 수동 의미 검토는
          [`manual-policy-review.md`](manual-policy-review.md)에 보존한다.

          ## 실행 가능한 fixture

          - [`fixture/install_policy.py`](fixture/install_policy.py)는 지정 commit을 detached
            checkout으로 만들고 fresh `CODEX_HOME`에 설치한 뒤 link target, Git object ID와
            SHA-256 identity를 기록한다.
          - [`fixture/controller.md`](fixture/controller.md)는 Codex process가 해당
            `CODEX_HOME`으로 새로 시작되고 measured boot attestation이 external manifest와
            일치해야 한다고 고정한다.
          - [`fixture/setup.py`](fixture/setup.py)는 clean primary repository, mismatch
            worktree와 controller state를 만든다.
          - [`fixture/verify.py`](fixture/verify.py)는 숨겨진 독립 task oracle이다.
          - [`fixture/integrate_worktree.py`](fixture/integrate_worktree.py)는 stopped-writer
            marker와 clean primary 상태를 확인한 뒤 isolated diff를 지정 primary worktree에
            commit 없이 적용하고 integration manifest를 남긴다.
          - [`fixture/thread_barrier.py`](fixture/thread_barrier.py)는 activated writer를
            controller release까지 non-terminal 상태로 유지한다.
          - [`fixture/self_test.py`](fixture/self_test.py)는 policy identity, premature
            integration rejection, final-primary integration, task oracle, barrier와 teardown을
            함께 검증한다.

          ## 대표 사례

          [`cases.json`](cases.json)은 열 사례와 모든 실행에 공통인 exact-policy loading 및
          final-primary completion assertions를 고정한다. Baseline/candidate 20개 행동 실행은
          모두 `not-run`이다. Fixture self-test와 수동 policy review를 모델 행동 평가로
          대체하지 않는다.

          ## 남은 병합 차단 항목

          실제 child-agent와 durable-thread tools가 노출되는 Codex runtime에서 각 사례를
          기준선과 후보에 새 policy checkout·새 `CODEX_HOME`·새 process·새 context·새 mutable
          state로 실행해야 한다. 최소 원시 근거는 다음과 같다.

          - exact policy-load manifest, launcher environment와 measured boot attestation
          - model, reasoning effort, sandbox, approval policy와 전체 tool inventory
          - 각 실행의 독립된 run manifest, root/carrier tool-call trace, approvals, messages,
            status changes와 최종 응답
          - 각 lifecycle 양성 조건과 recovery·ownership-only 음성 조건의 carrier 선택
          - cross-session handoff artifact와 같은 thread ID의 readdressability
          - writer quiescence 또는 별도 mutable worktree가 writable preflight보다 앞선 순서
          - read-only preflight, acknowledgement 재대조, 별도 activation의 호출 순서
          - mismatch thread에 activation·write가 없고 blocked 또는 허용 fallback이 정확히
            수행됐다는 근거
          - barrier 뒤에 주입된 post-activation loss와 fallback 금지의 실제 행동
          - isolated 결과의 stopped/reconciled primary 통합과 final-primary oracle 결과
          - 사례별 수동 판정

          이 실행이 완료되기 전에는 PR #42를 행동 검증 완료 상태로 표현해서는 안 된다.
          """)
          (evidence / "README.md").write_text(readme, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path

          root = Path("evidence/software-engineering/2026-08-27-durable-thread-carrier")
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              path.write_text(
                  "\n".join(line.rstrip() for line in text.splitlines()) + "\n",
                  encoding="utf-8",
              )
          PY

          rm .github/workflows/pr42-evaluation-v5.yml
          git add \
            .github/workflows/pr42-evaluation-v5.yml \
            "$EVIDENCE"
          git diff --cached --check
          git commit -m "Record durable-thread evaluation v5 evidence"
          git push origin HEAD:refactor/thread-aware-execution-orchestration
