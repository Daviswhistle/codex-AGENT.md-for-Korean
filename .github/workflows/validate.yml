name: Validate kit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_OPENAI_API_KEY: ${{ secrets.CODEX_OPENAI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Report isolated-eval credential availability
        shell: bash
        run: |
          if [[ -n "$OPENAI_API_KEY" ]]; then
            echo "OPENAI_API_KEY=present"
          else
            echo "OPENAI_API_KEY=absent"
          fi
          if [[ -n "$CODEX_OPENAI_API_KEY" ]]; then
            echo "CODEX_OPENAI_API_KEY=present"
          else
            echo "CODEX_OPENAI_API_KEY=absent"
          fi

      - name: Run all contracts and tests
        run: python3 scripts/validate_kit.py
