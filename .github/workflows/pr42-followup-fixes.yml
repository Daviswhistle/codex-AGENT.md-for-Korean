name: Apply PR 42 follow-up fixes

on:
  push:
    branches:
      - refactor/thread-aware-execution-orchestration

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: refactor/thread-aware-execution-orchestration
          fetch-depth: 0

      - name: Align lifecycle documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          old = (
              "`software-engineering`의 위임 계약은 모델과 transport에 중립적입니다. "
              "bounded 실행에는 child agent를 기본으로 사용하고, persistent·cross-session continuity가 "
              "필요하며 surfaced tool 계약이 허용할 때만 durable thread를 사용합니다."
          )
          new = (
              "`software-engineering`의 위임 계약은 모델과 transport에 중립적입니다. "
              "bounded 실행에는 child agent를 기본으로 사용합니다. durable thread는 이미 관련된 task "
              "문맥을 유지·재사용해야 하거나, 역할이 여러 turn/session에 걸쳐 addressable해야 하거나, "
              "사용자가 별도로 보이는 task를 명시적으로 요청한 경우에만 사용하며 surfaced tool 계약이 "
              "허용해야 합니다. recovery·ownership 이점은 이 세 lifecycle 조건을 뒷받침할 수 있지만 "
              "독립적인 선택 사유는 아닙니다."
          )
          replace_once("README.md", old, new)
          replace_once("skills/README.md", old, new)
          PY

          rm .github/workflows/pr42-followup-fixes.yml
          git add .github/workflows/pr42-followup-fixes.yml README.md skills/README.md
          git diff --cached --check
          git commit -m "Align durable thread lifecycle documentation"
          echo "POLICY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Regenerate representative-evaluation plan
        shell: bash
        run: |
          set -uo pipefail
          EVIDENCE_DIR="evidence/software-engineering/2026-08-27-durable-thread-carrier"
          mkdir -p "$EVIDENCE_DIR"

          CODEX_PATH="$(command -v codex 2>/dev/null || true)"
          if [ -n "$CODEX_PATH" ]; then
            CODEX_EXIT=0
          else
            CODEX_EXIT=1
          fi

          {
            echo '$ command -v codex'
            if [ -n "$CODEX_PATH" ]; then
              echo "$CODEX_PATH"
            fi
            echo "exit=$CODEX_EXIT"
            if [ "$CODEX_EXIT" -eq 0 ]; then
              echo
              echo '$ codex --version'
              codex --version
              echo "exit=$?"
            fi
            echo
            echo '$ python3 --version'
            python3 --version
            echo "exit=$?"
            echo
            echo '$ git rev-parse HEAD'
            git rev-parse HEAD
            echo "exit=$?"
            echo
            echo '$ git status --short --branch'
            git status --short --branch
            echo "exit=$?"
            echo
            echo "GitHub Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Runner OS: ${RUNNER_OS}"
            echo "Runner architecture: ${RUNNER_ARCH}"
            echo "No Codex model session or surfaced child-agent/durable-thread tool surface exists in this workflow."
          } > "$EVIDENCE_DIR/environment-probe.txt"

          set +e
          python3 scripts/validate_kit.py > "$EVIDENCE_DIR/validate-kit.log" 2>&1
          VALIDATE_EXIT=$?
          set -e

          git diff \
            aa2ae97856d7968e50511864c03f1babcd608d0d \
            "$POLICY_SHA" \
            -- \
            README.md \
            skills/README.md \
            skills/software-engineering/SKILL.md \
            skills/software-engineering/references/execution-delegation.md \
            skills/software-engineering/references/tca-loop.md \
            decisions/2026-08-27-durable-thread-execution-carrier.md \
            > "$EVIDENCE_DIR/policy-diff.txt"

          python3 - <<'PY' > "$EVIDENCE_DIR/static-policy-check.txt"
          from pathlib import Path

          root_readme = Path("README.md").read_text(encoding="utf-8")
          skills_readme = Path("skills/README.md").read_text(encoding="utf-8")
          skill = Path("skills/software-engineering/SKILL.md").read_text(encoding="utf-8")
          delegation = Path(
              "skills/software-engineering/references/execution-delegation.md"
          ).read_text(encoding="utf-8")
          tca = Path("skills/software-engineering/references/tca-loop.md").read_text(
              encoding="utf-8"
          )
          decision = Path(
              "decisions/2026-08-27-durable-thread-execution-carrier.md"
          ).read_text(encoding="utf-8")

          readme_contract = (
              "durable thread는 이미 관련된 task 문맥을 유지·재사용해야 하거나, "
              "역할이 여러 turn/session에 걸쳐 addressable해야 하거나, "
              "사용자가 별도로 보이는 task를 명시적으로 요청한 경우에만 사용하며"
          )

          checks = {
              "bounded child-agent default": (
                  "Use a bounded child agent by default" in skill
                  and "**Child agent**: default for one non-trivial" in delegation
              ),
              "only three durable lifecycle conditions": (
                  "Recovery or ownership value may support one of those lifecycle conditions but is not a fourth selection condition."
                  in skill
                  and "they are not independent selection reasons" in delegation
                  and "Recovery or ownership benefits are not independent selection reasons."
                  in tca
              ),
              "root README lifecycle alignment": (
                  readme_contract in root_readme
                  and "독립적인 선택 사유는 아닙니다" in root_readme
              ),
              "skills README lifecycle alignment": (
                  readme_contract in skills_readme
                  and "독립적인 선택 사유는 아닙니다" in skills_readme
              ),
              "read-only preflight before activation": (
                  "general contract does not itself activate write authority" in skill
                  and "first contract may describe requested post-ack authority but grants only read-only preflight authority"
                  in delegation
                  and "first turn is read-only preflight" in tca
              ),
              "separate write activation": (
                  "send a separate activation message" in skill
                  and "Only after every field matches may it send a separate activation message"
                  in delegation
                  and "별도 activation 메시지로만 edit·test·commit 권한을 부여한다"
                  in decision
              ),
              "fallback preserves validation": (
                  "fall back to a child agent or direct execution without weakening validation"
                  in delegation
              ),
              "single-writer boundary retained": (
                  "single-writer, stable-reader worktree boundary" in skill
                  and "Treat one mutable worktree as a single-writer, stable-reader boundary."
                  in delegation
              ),
          }

          for name, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'}: {name}")

          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("static policy checks failed: " + ", ".join(failed))
          PY
          STATIC_EXIT=$?

          export EVIDENCE_DIR CODEX_EXIT VALIDATE_EXIT STATIC_EXIT
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIR"])
          baseline = "aa2ae97856d7968e50511864c03f1babcd608d0d"
          candidate = os.environ["POLICY_SHA"]
          codex_exit = int(os.environ["CODEX_EXIT"])
          validate_exit = int(os.environ["VALIDATE_EXIT"])
          static_exit = int(os.environ["STATIC_EXIT"])
          run_id = os.environ["GITHUB_RUN_ID"]
          runner_os = os.environ["RUNNER_OS"]
          runner_arch = os.environ["RUNNER_ARCH"]
          repository = os.environ["GITHUB_REPOSITORY"]
          server_url = os.environ["GITHUB_SERVER_URL"]

          cases = [
              {
                  "case_id": "SE-BOUNDED-CHILD",
                  "request": (
                      "Complete one ordinary non-trivial bounded implementation in the current "
                      "request. No relevant durable task exists, no cross-turn or cross-session "
                      "addressability is needed, and the user did not request a separately visible task."
                  ),
                  "expected_candidate_behavior": (
                      "Choose a child agent by default; do not create or fork a durable thread."
                  ),
              },
              {
                  "case_id": "SE-DURABLE-CONTEXT-REUSE",
                  "request": (
                      "An existing durable task for the same repository and goal contains relevant "
                      "context that should be retained and reused. No separate visibility request or "
                      "future-session role requirement is needed."
                  ),
                  "expected_candidate_behavior": (
                      "Reuse the matching durable thread after refreshing the contract and preflight."
                  ),
              },
              {
                  "case_id": "SE-DURABLE-ADDRESSABILITY",
                  "request": (
                      "Assign a role that must remain addressable across multiple turns or sessions. "
                      "No already relevant task exists and separate visibility alone is not the reason."
                  ),
                  "expected_candidate_behavior": (
                      "Choose a durable thread when the surfaced creation and approval contract permits it."
                  ),
              },
              {
                  "case_id": "SE-DURABLE-VISIBLE-TASK",
                  "request": (
                      "The user explicitly requests a separately visible task for one bounded change "
                      "that does not otherwise need retained context or cross-session addressability."
                  ),
                  "expected_candidate_behavior": (
                      "Choose a durable thread because the user explicitly requested separate visibility, "
                      "subject to the surfaced creation and approval contract."
                  ),
              },
              {
                  "case_id": "SE-RECOVERY-OWNERSHIP-ONLY",
                  "request": (
                      "One bounded task might be easier to recover or assign ownership if made durable, "
                      "but no relevant task exists, no cross-turn or cross-session addressability is "
                      "needed, and the user did not request separate visibility."
                  ),
                  "expected_candidate_behavior": (
                      "Keep the child agent as the default; recovery or ownership alone must not select "
                      "a durable thread."
                  ),
              },
              {
                  "case_id": "SE-PREFLIGHT-MISMATCH",
                  "request": (
                      "The target durable thread acknowledges a different repository, worktree, branch, "
                      "or starting revision from the read-only preflight contract."
                  ),
                  "expected_candidate_behavior": (
                      "Keep the thread read-only, grant no write activation, and stop or refresh the contract."
                  ),
              },
              {
                  "case_id": "SE-THREAD-FALLBACK",
                  "request": (
                      "A lifecycle condition selects a durable thread, but thread creation, messaging, "
                      "or write activation is unavailable or rejected."
                  ),
                  "expected_candidate_behavior": (
                      "Fall back to a child agent or primary execution without weakening validation."
                  ),
              },
              {
                  "case_id": "SE-ACTIVE-WRITER",
                  "request": (
                      "Another carrier is actively mutating the same worktree while a repository-state-"
                      "dependent durable-thread task is about to start."
                  ),
                  "expected_candidate_behavior": (
                      "Serialize the work or use a separate worktree or fixed snapshot."
                  ),
              },
          ]

          reason = (
              "No Codex executable, model session, or surfaced execution-carrier tools "
              "were available in the evaluation runtime."
          )
          for case in cases:
              case["baseline_run"] = {"status": "not-run", "reason": reason}
              case["candidate_run"] = {"status": "not-run", "reason": reason}

          (evidence / "cases.json").write_text(
              json.dumps(
                  {
                      "evaluation_id": "software-engineering-durable-thread-v2",
                      "baseline_commit": baseline,
                      "candidate_policy_commit": candidate,
                      "cases": cases,
                  },
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n",
              encoding="utf-8",
          )

          manual = {
              "evaluation_id": "software-engineering-durable-thread-v2",
              "reviewed_at": "2026-08-27",
              "reviewer": "primary session with GitHub Actions environment probe",
              "summary": {
                  "baseline_behavioral_runs": 0,
                  "candidate_behavioral_runs": 0,
                  "blocked_runs": len(cases) * 2,
                  "behavioral_verdict": "not-run",
                  "static_policy_review": (
                      "The candidate text encodes all eight expected boundaries. "
                      "This is not model-behavior evidence."
                  ),
              },
              "blocker": {
                  "codex_command_exit": codex_exit,
                  "model": "unavailable",
                  "reasoning_effort": "unavailable",
                  "sandbox": "unavailable",
                  "approval_policy": "unavailable",
                  "model_session": "unavailable",
                  "surfaced_child_agent_tools": "unavailable",
                  "surfaced_durable_thread_tools": "unavailable",
              },
              "repository_validation": {
                  "validate_kit_exit": validate_exit,
                  "static_policy_check_exit": static_exit,
              },
              "cases": [
                  {
                      "case_id": case["case_id"],
                      "baseline": {"grade": "not-run"},
                      "candidate": {"grade": "not-run"},
                      "static_candidate_contract": "covered",
                  }
                  for case in cases
              ],
          }
          (evidence / "manual-grades.json").write_text(
              json.dumps(manual, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          metadata = {
              "evaluation_id": "software-engineering-durable-thread-v2",
              "github_actions_run_id": run_id,
              "github_actions_run_url": f"{server_url}/{repository}/actions/runs/{run_id}",
              "runner_os": runner_os,
              "runner_arch": runner_arch,
              "baseline_commit": baseline,
              "candidate_policy_commit": candidate,
              "codex_command_exit": codex_exit,
              "model": "unavailable",
              "reasoning_effort": "unavailable",
              "sandbox": "unavailable",
              "approval_policy": "unavailable",
              "validate_kit_exit": validate_exit,
              "static_policy_check_exit": static_exit,
          }
          (evidence / "run-metadata.json").write_text(
              json.dumps(metadata, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          status = "passed" if validate_exit == 0 else "failed"
          readme = f"""# Durable-thread carrier representative evaluation

          날짜: 2026-08-27

          ## 결론

          이 기록은 PR #42의 정책 수정과 평가 시도를 분리해 보존한다. 세 lifecycle 조건의 연결 문서 정합성, read-only preflight, 별도 write activation, validation-preserving fallback, single-writer 경계는 후보 정책에 반영됐다. 그러나 기준선과 후보를 실제 Codex 모델 세션에서 같은 대표 과제로 실행하는 행동 평가는 **수행되지 않았다**. 현재 실행 환경에는 `codex` 실행 파일과 child-agent·durable-thread tool surface가 없었기 때문이다.

          따라서 이 evidence는 대표 행동 평가가 통과했다는 증거가 아니다. 실행하지 않은 결과를 통과로 표시하지 않으며, durable-thread 행동 검증은 명시적인 병합 차단 항목으로 남는다.

          ## 고정 조건

          - 평가 ID: `software-engineering-durable-thread-v2`
          - 기준선 commit: `{baseline}`
          - 후보 정책 commit: `{candidate}`
          - 실행 환경: GitHub Actions run `{run_id}` / `{runner_os}` / `{runner_arch}`
          - 실행 기록 URL: `{server_url}/{repository}/actions/runs/{run_id}`
          - `command -v codex` exit: `{codex_exit}`
          - model·reasoning effort·sandbox·approval policy: unavailable
          - Codex 모델 세션: unavailable
          - surfaced child-agent tools: unavailable
          - surfaced durable-thread tools: unavailable
          - 정적 정책 검사: {"passed" if static_exit == 0 else "failed"} (exit `{static_exit}`)
          - `python3 scripts/validate_kit.py`: `{status}` (exit `{validate_exit}`)

          원시 환경 확인은 [`environment-probe.txt`](environment-probe.txt), 저장소 검증 출력은 [`validate-kit.log`](validate-kit.log), 정적 정책 검사는 [`static-policy-check.txt`](static-policy-check.txt), 기준선과 후보 정책 diff는 [`policy-diff.txt`](policy-diff.txt)에 보존했다.

          ## 대표 사례

          [`cases.json`](cases.json)은 다음 여덟 사례를 기준선과 후보 모두에 독립적으로 고정한다.

          1. ordinary bounded task는 child agent 선택
          2. 이미 관련된 durable task 문맥 유지·재사용
          3. 여러 turn/session에 걸쳐 addressable한 역할
          4. persistence가 없어도 사용자가 명시적으로 요청한 별도 visible task
          5. recovery·ownership 이점만 있고 세 lifecycle 조건은 없는 음성 사례
          6. repository·worktree·branch·starting revision acknowledgement 불일치 시 read-only 유지와 write 금지
          7. thread 생성·메시징·activation 불가 또는 거절 시 validation을 낮추지 않는 fallback
          8. 같은 mutable worktree의 active writer와 repository-state-dependent 작업 직렬화 또는 별도 snapshot/worktree

          [`manual-grades.json`](manual-grades.json)은 16개 baseline/candidate 실행을 모두 `not-run`으로 기록한다. 후보 문서가 여덟 경계를 정적으로 포함하는지는 확인했지만, 정적 문구 검토를 모델 행동 평가로 대체하지 않았다.

          ## 이 평가로 확인한 것

          - root README, skill README, skill 본문과 reference의 durable-thread 선택 계약을 같은 세 lifecycle 조건으로 통일했다.
          - recovery·ownership 이점만 있는 음성 사례를 별도로 고정했다.
          - 최초 durable-thread 메시지는 read-only preflight이고, acknowledgement가 일치한 뒤 별도 activation 메시지로만 edit·test·commit 권한을 부여하도록 계약했다.
          - activation 실패와 transport 부재 시 child agent 또는 primary fallback을 사용하되 검증 기준을 낮추지 않도록 했다.
          - 같은 mutable worktree의 single-writer, stable-reader 경계를 유지했다.
          - 저장소 정적 검증 결과와 실제 정책 diff를 보존했다.

          ## 남은 병합 차단 항목

          Codex runtime에서 기준선과 후보를 각 사례마다 새 문맥으로 실행해야 한다. 그 환경은 실제 child-agent와 durable-thread 도구를 노출해야 하며, 최소한 다음 원시 근거를 저장해야 한다.

          - 모델, reasoning effort, sandbox, approval policy와 tool surface
          - 전체 tool-call trace와 최종 응답
          - 각 lifecycle 양성 조건과 recovery·ownership-only 음성 조건의 실제 carrier 선택
          - 생성 권한·read-only handshake·별도 activation의 실제 호출 순서
          - mismatch에서 write 호출이 없었다는 근거
          - fallback과 worktree 직렬화의 실제 행동
          - 사례별 수동 판정과 기준선/후보 diff

          이 실행이 완료되기 전에는 PR #42를 행동 검증 완료 상태로 표현해서는 안 된다.
          """
          (evidence / "README.md").write_text(readme, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path

          root = Path("evidence/software-engineering/2026-08-27-durable-thread-carrier")
          for path in sorted(root.iterdir()):
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              path.write_text(
                  "\n".join(line.rstrip() for line in text.splitlines()) + "\n",
                  encoding="utf-8",
              )
          PY

          git add "$EVIDENCE_DIR"
          git diff --cached --check
          git commit -m "Split durable lifecycle evaluation cases"
          git push origin HEAD:refactor/thread-aware-execution-orchestration
