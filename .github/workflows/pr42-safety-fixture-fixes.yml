          )
          replace_once(
              "decisions/2026-08-27-durable-thread-execution-carrier.md",
              "5. 하나의 mutable worktree는 carrier 수와 무관하게 single-writer, stable-reader 경계다. durable thread는 worktree 격리를 제공하지 않는다.",
