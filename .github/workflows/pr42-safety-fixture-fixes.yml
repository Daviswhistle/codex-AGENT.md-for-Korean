          mkdir -p "$FIXTURE_DIR"
          rm -f "$EVIDENCE_DIR/static-policy-check.txt"

          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          root = Path("evidence/software-engineering/2026-08-27-durable-thread-carrier/fixture")
          root.mkdir(parents=True, exist_ok=True)

          files = {
              "task.md": dedent("""\
                  # Fixture implementation task

                  In the fixture repository, add `dedupe_labels(values: list[str]) -> list[str]`
